name: Update scores

on:
  schedule:
    # Every 30 minutes during the tournament (June 11 - July 19, 2026).
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest scores
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 scripts/fetch_scores.py

      - name: Commit and push if scores changed
        run: |
          # Ignore changes that only touch the "updated" timestamp.
          if git diff --numstat -- data/matches.json | grep -qE '^([2-9]|[0-9]{2,})\s'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/matches.json
            git commit -m "Update match scores"
            git push
          else
            git checkout -- data/matches.json
            echo "No score changes."
          fi
