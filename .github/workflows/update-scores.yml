name: Update scores

on:
  schedule:
    # Nominally every 15 minutes during the tournament (June 11 - July 19,
    # 2026). GitHub runs scheduled workflows best-effort and throttles them
    # aggressively, so in practice this fires far less often. Off-peak minute
    # offsets (avoiding :00/:30) reduce the throttling a bit. For guaranteed
    # cadence, trigger the workflow_dispatch event from an external scheduler
    # (see "Making updates faster" in the README).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit updated scores (uncheck for a diagnostic dry run)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest scores
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 scripts/fetch_scores.py

      - name: Commit and push if scores changed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
        run: |
          # Ignore changes that only touch the "updated" timestamp.
          if git diff --numstat -- data/matches.json | grep -qE '^([2-9]|[0-9]{2,})\s'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/matches.json
            git commit -m "Update match scores"
            git push
          else
            git checkout -- data/matches.json
            echo "No score changes."
          fi
